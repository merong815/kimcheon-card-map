<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>어데GO 김천</title>
<meta name="robots" content="noindex">
<style>
  :root{--bg:#f3f5f4;--ink:#18231f;--accent:#0f7a5c}
  @media (prefers-color-scheme:dark){:root{--bg:#101614;--ink:#e7ece9;--accent:#4cc39a}}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;text-align:center;padding:16px}
  a{display:inline-block;margin-top:14px;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;border-radius:99px;padding:12px 22px;font-size:17px}
  p{font-size:16px;line-height:1.6;margin:6px 0}
</style>
<script>
  // 주소가 조금 틀려도(뒤에 글자가 붙는 등) 앱 첫 화면으로 보내 줌
  (function(){
    var base = "/kimcheon-card-map/";
    var go = base + (location.search || "") + (location.hash || "");
    setTimeout(function(){ location.replace(go); }, 800);
    window.__go = go;
  })();
</script>
</head>
<body>
  <div>
    <p style="font-size:42px;margin:0">🍇</p>
    <p><b>주소가 조금 달라서 찾지 못했어여.</b></p>
    <p>어데GO 김천 첫 화면으로 바로 옮겨 드릴게여…</p>
    <a href="/kimcheon-card-map/" id="go">어데GO 김천 열기</a>
  </div>
  <script>document.getElementById("go").href = window.__go || "/kimcheon-card-map/";</script>
</body>
</html>
