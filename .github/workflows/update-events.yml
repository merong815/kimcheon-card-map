name: 주간행사계획 갱신

on:
  schedule:
    # 주말에만: 한국시간 금요일 19:07, 토요일 09:07, 일요일 09:07 (UTC로 적어야 함)
    - cron: "7 10 * * 5"
    - cron: "7 0 * * 6"
    - cron: "7 0 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 한글 파일 읽기 라이브러리 설치
        run: pip install olefile
      - name: 김천시 누리집에서 주간행사계획 받기
        # 예약 실행: 다음 주 것을 이미 받았으면 건너뜀 / 손으로 실행: 무조건 다시 받음
        run: python scripts/update_events.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
      - name: 저장
        run: |
          git add events.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git config user.name "events-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "주간행사계획 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
