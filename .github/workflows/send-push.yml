name: 알림 보내기
# 한국시간 기준: 매일 9시쯤 '오늘 김천 행사·배구·공연', 매일 7시쯤 '오늘 즐겨찾기'
# GitHub 예약 실행은 1~3시간씩 늦거나 건너뛰어서, 의견함 Apps Script 시간 예약이 정시에 깨움(workflow_dispatch).
# 아래 예약은 쓰지 않음(늦게 와서 두 번 보내는 일을 막으려고 지움).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "daily(오늘 김천 행사) 또는 morning(오늘 즐겨찾기)"
        required: true
        default: "daily"

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pywebpush==2.5.0 requests
      - name: 보내기
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then MODE="${{ github.event.inputs.mode }}";
          else MODE=daily; fi
          python scripts/send_push.py --$MODE
