name: 요즘 영화·공연 갱신

on:
  schedule:
    # 매일 한국시간 08:13 (UTC 23:13) — 전날 박스오피스가 아침에 확정됨
    - cron: "13 23 * * *"
  workflow_dispatch: {}   # Actions 화면에서 'Run workflow'로 바로 실행(1분 안에 끝남)

permissions:
  contents: write

concurrency:
  group: update-movies
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 영화진흥위원회(KOBIS) 전국 박스오피스 받기
        env:
          KOBIS_KEY: ${{ secrets.KOBIS_KEY }}
        run: python scripts/update_life.py --movies

      - name: 김천 공연 일정 받기(문화예술회관 일정표 + KOPIS)
        continue-on-error: true
        env:
          KOPIS_KEY: ${{ secrets.KOPIS_KEY }}
        run: python scripts/update_gcart.py

      - name: 바뀐 자료 저장
        run: |
          mkdir -p /tmp/o; for f in movies.json gcart.json; do if [ -f "$f" ]; then cp "$f" /tmp/o/; fi; done
          git config user.name "movie-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            for f in movies.json gcart.json; do if [ -f "/tmp/o/$f" ]; then cp "/tmp/o/$f" .; git add "$f"; fi; done
            if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
            git commit -m "요즘 영화·공연 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            if git push; then exit 0; fi
            sleep 10
          done
          exit 1
