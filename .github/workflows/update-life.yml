name: 생활정보 갱신

on:
  schedule:
    # 매일 한국시간 05:23 (UTC 20:23)
    - cron: "23 20 * * *"
  workflow_dispatch: {}   # Actions 화면에서 'Run workflow'로 수동 실행

permissions:
  contents: write

concurrency:
  group: update-life
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 공공 API에서 생활정보 받기
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          SAFETY_COLD_KEY: ${{ secrets.SAFETY_COLD_KEY }}
          SAFETY_HEAT_KEY: ${{ secrets.SAFETY_HEAT_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KOBIS_KEY: ${{ secrets.KOBIS_KEY }}
        run: python scripts/update_life.py

      - name: 바뀐 자료 저장
        # 받는 데 1시간 넘게 걸려서, 그 사이 사람이 index.html을 올려도 충돌 없게
        # 최신 저장소를 다시 받은 뒤 생활정보 항목(life_patch.json)·nb·fest.json만 덮어씀
        run: |
          mkdir -p /tmp/out
          if [ -d nb ]; then cp -r nb /tmp/out/; fi
          for f in fest.json movies.json life_patch.json; do if [ -f "$f" ]; then cp "$f" /tmp/out/; fi; done
          git config user.name "life-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            if [ -d /tmp/out/nb ]; then mkdir -p nb && cp -r /tmp/out/nb/. nb/; fi
            if [ -f /tmp/out/fest.json ]; then cp /tmp/out/fest.json .; fi
            if [ -f /tmp/out/movies.json ]; then cp /tmp/out/movies.json .; fi
            if [ -f /tmp/out/life_patch.json ]; then python scripts/update_life.py --apply /tmp/out/life_patch.json; fi
            git add index.html nb
            if [ -f fest.json ]; then git add fest.json; fi
            if [ -f movies.json ]; then git add movies.json; fi
            if git diff --cached --quiet; then
              echo "바뀐 자료 없음"
              exit 0
            fi
            git commit -m "생활정보 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            if git push; then exit 0; fi
            echo "올리기 실패 → 다시 시도 ($i)"
            sleep 10
          done
          exit 1
