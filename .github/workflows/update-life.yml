name: 생활정보 갱신

on:
  schedule:
    # 매일 한국시간 05:23 (UTC 20:23)
    - cron: "23 20 * * *"
  workflow_dispatch: {}   # Actions 화면에서 'Run workflow'로 수동 실행

permissions:
  contents: write

concurrency:
  group: update-life
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 공공 API에서 생활정보 받기
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          SAFETY_COLD_KEY: ${{ secrets.SAFETY_COLD_KEY }}
          SAFETY_HEAT_KEY: ${{ secrets.SAFETY_HEAT_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: python scripts/update_life.py

      - name: 바뀐 자료 저장
        run: |
          if git diff --quiet -- index.html; then
            echo "바뀐 자료 없음"
            exit 0
          fi
          git config user.name "life-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "생활정보 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
