name: 주유 가격 갱신

on:
  schedule:
    # 매일 한국시간 07:17, 17:17 (UTC로 적어야 함: 22:17, 08:17)
    # 오피넷 무료 키는 하루 300건 → 한 번에 140건씩 2번. 손으로 Run workflow를 더 누르면 한도를 넘을 수 있음
    - cron: "17 22 * * *"
    - cron: "17 8 * * *"
  workflow_dispatch: {}   # Actions 화면에서 'Run workflow'로 수동 실행

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 좌표 변환 라이브러리 설치
        run: pip install pyproj

      - name: 오피넷 가격 받기
        env:
          OPINET_KEY: ${{ secrets.OPINET_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: python scripts/update_prices.py

      - name: 바뀐 가격 저장
        run: |
          if git diff --quiet -- prices.json gas_all.json && git ls-files --error-unmatch prices.json >/dev/null 2>&1 && { [ ! -f gas_all.json ] || git ls-files --error-unmatch gas_all.json >/dev/null 2>&1; }; then
            echo "가격 변동 없음"
            exit 0
          fi
          git config user.name "price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json gas_all.json
          git commit -m "주유 가격 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          # 실행 중에 누가 파일을 올렸으면 그 위에 얹어서 올림
          git pull --rebase
          git push
