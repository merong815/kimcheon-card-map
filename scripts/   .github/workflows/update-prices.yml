name: 주유 가격 갱신

on:
  schedule:
    # 매일 한국시간 07:17, 12:17, 18:17 (UTC로 적어야 함: 22:17, 03:17, 09:17)
    - cron: "17 22 * * *"
    - cron: "17 3 * * *"
    - cron: "17 9 * * *"
  workflow_dispatch: {}   # Actions 화면에서 'Run workflow'로 수동 실행

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 오피넷 가격 받기
        env:
          OPINET_KEY: ${{ secrets.OPINET_KEY }}
        run: python scripts/update_prices.py

      - name: 바뀐 가격 저장
        run: |
          if git diff --quiet -- prices.json && git ls-files --error-unmatch prices.json >/dev/null 2>&1; then
            echo "가격 변동 없음"
            exit 0
          fi
          git config user.name "price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git commit -m "주유 가격 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push
